name: Editar Video Automaticamente

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:
    inputs:
      voz:
        description: 'Escolha a voz da narracao'
        required: true
        default: 'lessac'
        type: choice
        options:
          - lessac
          - ryan
          - amy
          - hfc_female
          - joe
      brilho:
        description: 'Escolha o overlay de brilho'
        required: true
        default: 'nenhum'
        type: choice
        options:
          - nenhum
          - brilho1
          - brilho2
          - brilho3
          - brilho4
          - brilho5
          - brilho6
          - brilho7

jobs:
  edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Whisper e Piper TTS
        run: pip install piper-tts

      - name: Baixar o modelo de voz escolhido
        id: voz
        run: |
          VOZ="${{ github.event.inputs.voz || 'lessac' }}"
          case "$VOZ" in
            lessac) QUALIDADE="high" ;;
            ryan) QUALIDADE="high" ;;
            amy) QUALIDADE="medium" ;;
            hfc_female) QUALIDADE="medium" ;;
            joe) QUALIDADE="medium" ;;
            *) VOZ="lessac"; QUALIDADE="high" ;;
          esac
          NOME="en_US-${VOZ}-${QUALIDADE}"
          echo "Baixando voz: $NOME"
          curl -fL -o modelo.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/${VOZ}/${QUALIDADE}/${NOME}.onnx"
          curl -fL -o modelo.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/${VOZ}/${QUALIDADE}/${NOME}.onnx.json"

          mkdir -p ~/.fonts
          curl -fL -o ~/.fonts/Poppins-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf"
          fc-cache -f ~/.fonts

      - name: Encontrar o video de entrada
        id: findvideo
        run: |
          VIDEO_FILE=$(find input -name "*.mp4" | head -n 1)
          echo "Video encontrado: $VIDEO_FILE"
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

      - name: Verificar overlay de brilho escolhido
        id: findglow
        run: |
          BRILHO="${{ github.event.inputs.brilho || 'nenhum' }}"
          if [ "$BRILHO" = "nenhum" ]; then
            echo "glow_file=nenhuma" >> "$GITHUB_OUTPUT"
          else
            echo "glow_file=assets/$BRILHO.mp4" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar efeitos visuais
        run: python skills/video-editor-whisper/scripts/apply_effects.py "${{ steps.findvideo.outputs.video_file }}" com_efeitos.mp4 "${{ steps.findglow.outputs.glow_file }}"

      - name: Gerar narracao (Piper TTS)
        run: python skills/video-editor-whisper/scripts/generate_narration.py input/narracao.txt narracao.wav modelo.onnx

      - name: Verificar se ha musica de fundo
        id: findmusic
        run: |
          if [ -f "input/musica.mp3" ]; then
            echo "music_file=input/musica.mp3" >> "$GITHUB_OUTPUT"
          else
            echo "music_file=nenhuma" >> "$GITHUB_OUTPUT"
          fi

      - name: Compor o video final (narracao + musica)
        run: python skills/video-editor-whisper/scripts/compose_final.py com_efeitos.mp4 narracao.wav "${{ steps.findmusic.outputs.music_file }}" final.mp4

      - name: Verificar se ha imagem para sobrepor
        id: findimage
        run: |
          if [ -f "input/image.png" ]; then
            echo "image_file=input/image.png" >> "$GITHUB_OUTPUT"
          else
            echo "image_file=nenhuma" >> "$GITHUB_OUTPUT"
          fi

      - name: Sobrepor imagem no final do video
        run: python skills/video-editor-whisper/scripts/add_image_overlay.py final.mp4 "${{ steps.findimage.outputs.image_file }}" final_completo.mp4 8

      - name: Disponibilizar o video final para download
        uses: actions/upload-artifact@v4
        with:
          name: video-final
          path: final_completo.mp4
