name: Editar Video Automaticamente

on:
  push:
    paths:
      - 'input/**.mp4'
  workflow_dispatch:

jobs:
  edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Whisper
        run: pip install openai-whisper

      - name: Encontrar o video de entrada
        id: findvideo
        run: |
          VIDEO_FILE=$(find input -name "*.mp4" | head -n 1)
          echo "Video encontrado: $VIDEO_FILE"
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

      - name: Extrair o audio do video
        run: ffmpeg -y -i "${{ steps.findvideo.outputs.video_file }}" -vn -acodec pcm_s16le -ar 16000 -ac 1 audio.wav

      - name: Transcrever o audio
        run: python skills/video-editor-whisper/scripts/transcribe.py audio.wav transcript.json
        
      - name: Depurar - mostrar conteudo do transcript
        run: |
          echo "Tamanho do arquivo transcript.json:"
          wc -c transcript.json
          echo "Conteudo:"
          cat transcript.json

      - name: Decidir os cortes automaticamente
        run: python skills/video-editor-whisper/scripts/analyze_transcript.py transcript.json cuts.json

      - name: Editar o video final
        run: python skills/video-editor-whisper/scripts/edit_video.py "${{ steps.findvideo.outputs.video_file }}" cuts.json output.mp4

      - name: Disponibilizar o video editado para download
        uses: actions/upload-artifact@v4
        with:
          name: video-editado
          path: output.mp4
