name: Editar Video Automaticamente

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:
    inputs:
      voz:
        description: 'Escolha a voz da narracao'
        required: true
        default: 'en-US-AriaNeural'
        type: choice
        options:
          - en-US-AriaNeural
          - en-US-JennyNeural
          - en-US-EmmaNeural
          - en-US-MichelleNeural
          - en-US-SaraNeural
          - en-US-GuyNeural
          - en-US-DavisNeural
          - en-US-AndrewNeural
          - en-US-BrianNeural
          - en-US-EricNeural
      brilho:
        description: 'Escolha o overlay de brilho'
        required: true
        default: 'nenhum'
        type: choice
        options:
          - nenhum
          - brilho1
          - brilho2
          - brilho3
          - brilho4
          - brilho5
          - brilho6
          - brilho7

jobs:
  edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Whisper e edge-tts
        run: pip install openai-whisper edge-tts

      - name: Instalar a fonte Poppins para as legendas
        run: |
          mkdir -p ~/.fonts
          curl -fL -o ~/.fonts/Poppins-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf"
          fc-cache -f ~/.fonts

      - name: Encontrar o video de entrada
        id: findvideo
        run: |
          VIDEO_FILE=$(find input -name "*.mp4" | head -n 1)
          echo "Video encontrado: $VIDEO_FILE"
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

      - name: Verificar overlay de brilho escolhido
        id: findglow
        run: |
          BRILHO="${{ github.event.inputs.brilho || 'nenhum' }}"
          if [ "$BRILHO" = "nenhum" ]; then
            echo "glow_file=nenhuma" >> "$GITHUB_OUTPUT"
          else
            echo "glow_file=assets/overlays/$BRILHO.mp4" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar efeitos visuais
        run: python skills/video-editor-whisper/scripts/apply_effects.py "${{ steps.findvideo.outputs.video_file }}" com_efeitos.mp4 "${{ steps.findglow.outputs.glow_file }}"

      - name: Gerar narracao em ingles (edge-tts)
        run: python skills/video-editor-whisper/scripts/generate_narration.py input/narracao.txt narracao.mp3 "${{ github.event.inputs.voz || 'en-US-AriaNeural' }}"

      - name: Transcrever a narracao (para legendas)
        run: python skills/video-editor-whisper/scripts/transcribe.py narracao.mp3 narracao_transcript.json en

      - name: Gerar arquivo de legendas
        run: python skills/video-editor-whisper/scripts/make_srt.py narracao_transcript.json legendas.srt

      - name: Verificar se ha musica de fundo
        id: findmusic
        run: |
          if [ -f "input/musica.mp3" ]; then
            echo "music_file=input/musica.mp3" >> "$GITHUB_OUTPUT"
          else
            echo "music_file=nenhuma" >> "$GITHUB_OUTPUT"
          fi

      - name: Compor o video final (narracao + musica + legendas)
        run: python skills/video-editor-whisper/scripts/compose_final.py com_efeitos.mp4 narracao.mp3 "${{ steps.findmusic.outputs.music_file }}" legendas.srt final.mp4 Poppins

      - name: Disponibilizar o video final para download
        uses: actions/upload-artifact@v4
        with:
          name: video-final
          path: final.mp4
