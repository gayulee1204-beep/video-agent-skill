name: Editar Video Automaticamente

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:

jobs:
  edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Whisper e requests
        run: pip install openai-whisper requests

      - name: Instalar a fonte Poppins para as legendas
        run: |
          mkdir -p ~/.fonts
          curl -L -o ~/.fonts/Poppins-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf"
          fc-cache -f ~/.fonts

      - name: Encontrar o video de entrada
        id: findvideo
        run: |
          VIDEO_FILE=$(find input -name "*.mp4" | head -n 1)
          echo "Video encontrado: $VIDEO_FILE"
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

      - name: Extrair o audio do video
        run: ffmpeg -y -i "${{ steps.findvideo.outputs.video_file }}" -vn -acodec pcm_s16le -ar 16000 -ac 1 audio.wav

      - name: Transcrever o audio original
        run: python skills/video-editor-whisper/scripts/transcribe.py audio.wav transcript.json

      - name: Decidir os cortes automaticamente
        run: python skills/video-editor-whisper/scripts/analyze_transcript.py transcript.json cuts.json

      - name: Cortar silencios do video
        run: python skills/video-editor-whisper/scripts/edit_video.py "${{ steps.findvideo.outputs.video_file }}" cuts.json cortado.mp4

      - name: Gerar narracao em ingles (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python skills/video-editor-whisper/scripts/generate_narration.py input/narracao.txt narracao.mp3

      - name: Transcrever a narracao (para legendas)
        run: python skills/video-editor-whisper/scripts/transcribe.py narracao.mp3 narracao_transcript.json en

      - name: Gerar arquivo de legendas
        run: python skills/video-editor-whisper/scripts/make_srt.py narracao_transcript.json legendas.srt

      - name: Verificar se ha musica de fundo
        id: findmusic
        run: |
          if [ -f "input/musica.mp3" ]; then
            echo "music_file=input/musica.mp3" >> "$GITHUB_OUTPUT"
          else
            echo "music_file=nenhuma" >> "$GITHUB_OUTPUT"
          fi

      - name: Compor o video final (narracao + musica + legendas)
        run: python skills/video-editor-whisper/scripts/compose_final.py cortado.mp4 narracao.mp3 "${{ steps.findmusic.outputs.music_file }}" legendas.srt final.mp4 Poppins

      - name: Disponibilizar o video final para download
        uses: actions/upload-artifact@v4
        with:
          name: video-final
          path: final.mp4
